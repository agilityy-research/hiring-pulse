# Hiring Pulse site. Built by GitHub Pages (Jekyll) from the main branch root; nothing else to run.
# url and baseurl are left unset on purpose: jekyll-github-metadata fills them in on GitHub Pages from the
# repository and the CNAME file, so the same source works at agilityy-research.github.io/hiring-pulse and at
# hiring.agilityy.com without an edit.
title: Hiring Pulse
tagline: Weekly startup hiring benchmarks from 21,000+ job boards
description: >-
  Weekly startup hiring benchmarks by Agilityy Research, measured from the public job boards of 21,000+
  companies read every day: open roles, biggest movers, days-to-fill, AI/ML share, remote share, by function and
  industry. Free every Monday under CC BY 4.0; the daily data behind it is pay as you go, per row.
author: Agilityy Research
lang: en
timezone: UTC

# Facts the pages quote. Edit here when the universe changes (monthly refresh) and every page follows.
coverage:
  companies: "21,000+"   # rounded on purpose: the exact count of the day is in each report's coverage line
  companies_since: "2026-11-22"
  companies_before: "10,000+"
  vendors: "Greenhouse, Lever, Ashby, SmartRecruiters, Recruitee and Personio"
  vendors_short: "Greenhouse, Lever, Ashby, SmartRecruiters, Recruitee, Personio"
  daily_since: "2026-11-21"
  with_industry: "around 700"
  flows_from: "2026-12-07"
  yc_subset: "639"
  yc_subset_since: "2026-11-06"
# Monday e-mail. Leave empty and the signup box is not shown. To switch it on: create a free list at a provider that
# offers a plain HTML form (Buttondown: https://buttondown.com/<list>, action "https://buttondown.com/api/emails/embed-subscribe/<list>";
# Kit, MailerLite and Beehiiv work the same way), paste the form's action URL here, and the site renders a signup box.
newsletter_action: ""
newsletter_email_field: "email"
# One-off studies that sit outside the weekly series (file names in reports/ without the .md).
baseline_reports:
  - "2026-11-20"

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# All default on GitHub Pages; listed so a local `bundle exec jekyll serve` behaves the same.
plugins:
  - jekyll-optional-front-matter   # the weekly pipeline commits plain Markdown reports (no front matter); they still become pages
  - jekyll-default-layout          # ... in _layouts/default.html
  - jekyll-titles-from-headings    # ... titled from their first heading
  - jekyll-relative-links
  - jekyll-github-metadata
  - jekyll-sitemap

optional_front_matter:
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: false

defaults:
  - scope:
      path: "reports"
    values:
      sitemap: true

exclude:
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
