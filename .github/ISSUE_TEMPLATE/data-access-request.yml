name: Data access request
description: Ask for the full hiring history as a feed, a custom cut, a larger sample or a quote.
title: "Data access request: <organisation>"
labels: ["data-access"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest. Tell us what you need and we reply in this thread, usually within two business days.
        What the data contains and the free sample: https://agilityy-research.github.io/hiring-pulse/for-data-teams/
  - type: input
    id: organisation
    attributes:
      label: Organisation
      placeholder: Company, fund or institution
    validations:
      required: true
  - type: dropdown
    id: use
    attributes:
      label: What will you use it for?
      options:
        - Sales or go-to-market signals
        - Investing or market research
        - Talent, HR or compensation benchmarks
        - A product feature or data pipeline
        - Academic research or journalism
        - Something else (describe below)
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Which tables?
      options:
        - Daily signals (one row per company per day)
        - Job events (one row per role opened or closed)
        - Both
        - A custom cut (describe below)
    validations:
      required: true
  - type: dropdown
    id: delivery
    attributes:
      label: Preferred delivery
      options:
        - CSV files (S3 or AWS Data Exchange)
        - Snowflake share
        - Apify feed, pay per row
        - Not sure yet
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Companies or filters, history needed, start date, update frequency, anything else.
      placeholder: e.g. all fintech companies, daily signals since launch, monthly refresh
  - type: input
    id: reply
    attributes:
      label: Where should we reply, if not in this thread?
      description: Optional. Leave blank to keep the conversation here; issues are public.
